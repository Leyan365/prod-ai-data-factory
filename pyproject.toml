[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-data-bot"
version = "0.1.0"
description = "Tutorial-driven training data curation bot for local demo workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Training Data Bot Team", email = "team@company.com" },
]
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "python-docx>=1.1",
  "pymupdf>=1.24",
  "pymupdf4llm>=0.0.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
training-data-bot = "training_data_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
